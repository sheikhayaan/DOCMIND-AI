      <stop offset="100%" stop-color="#a855f7" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#ffffff" stroke-opacity="0.035" stroke-width="1"/>
    </pattern>
    
  </defs>
  <rect width="1280" height="452" fill="url(#bgGrad)"/>
  <rect width="1280" height="452" fill="url(#grid)"/>

  <ellipse cx="180" cy="60" rx="380" ry="240" fill="url(#haloBlue)"/>
  <ellipse cx="1120" cy="300" rx="380" ry="240" fill="url(#haloViolet)"/>
  <ellipse cx="640" cy="180" rx="300" ry="150" fill="url(#haloBlue)" opacity="0.5"/>
<circle cx="640" cy="196" r="186" fill="none" stroke="url(#blueViolet)" stroke-opacity="0.2" stroke-width="1.1" stroke-dasharray="5 9"/><circle cx="640" cy="196" r="150" fill="none" stroke="url(#blueViolet)" stroke-opacity="0.3" stroke-width="1.1" stroke-dasharray="5 9"/><circle cx="640" cy="196" r="112" fill="none" stroke="url(#blueViolet)" stroke-opacity="0.42" stroke-width="1.1" stroke-dasharray="5 9"/><circle cx="640" cy="196" r="76" fill="url(#haloBlue)"/>
  <g filter="url(#softglow)">
